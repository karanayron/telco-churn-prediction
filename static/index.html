<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telco Churn Predictor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: radial-gradient(circle at top left, #1e293b, #0f172a 60%, #020617);
      color: #f8fafc;
    }
    .card {
      width: 100%; max-width: 680px; padding: 32px; border-radius: 20px;
      background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 24px 48px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 6px; }
    p.sub { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    label { display: block; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 10px 12px; border-radius: 10px; font-size: 0.92rem;
      background: rgba(15, 23, 42, 0.7); color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.14); outline: none;
    }
    input:focus, select:focus { border-color: #38bdf8; }
    button {
      margin-top: 22px; width: 100%; padding: 12px; border: none; border-radius: 12px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer; color: #0f172a;
      background: linear-gradient(135deg, #38bdf8, #818cf8); transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .result {
      margin-top: 22px; padding: 16px; border-radius: 12px; display: none;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    }
    .High { border-color: #f87171; color: #fca5a5; }
    .Medium { border-color: #fbbf24; color: #fde68a; }
    .Low { border-color: #34d399; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Customer Churn Predictor</h1>
    <p class="sub">Powered by FastAPI &amp; scikit-learn</p>

    <form id="churnForm">
      <div class="grid">
        <div>
          <label>Tenure (Months)</label>
          <input type="number" id="tenure" min="0" max="72" value="6" required />
        </div>
        <div>
          <label>Monthly Charges ($)</label>
          <input type="number" id="MonthlyCharges" step="0.5" min="18" max="150" value="85" required />
        </div>
        <div>
          <label>Contract</label>
          <select id="Contract">
            <option>Month-to-month</option>
            <option>One year</option>
            <option>Two year</option>
          </select>
        </div>
        <div>
          <label>Internet Service</label>
          <select id="InternetService">
            <option>Fiber optic</option>
            <option>DSL</option>
            <option>No</option>
          </select>
        </div>
        <div>
          <label>Payment Method</label>
          <select id="PaymentMethod">
            <option>Electronic check</option>
            <option>Mailed check</option>
            <option>Bank transfer (automatic)</option>
            <option>Credit card (automatic)</option>
          </select>
        </div>
        <div>
          <label>Tech Support</label>
          <select id="TechSupport">
            <option>No</option>
            <option>Yes</option>
            <option>No internet service</option>
          </select>
        </div>
        <div>
          <label>Online Security</label>
          <select id="OnlineSecurity">
            <option>No</option>
            <option>Yes</option>
            <option>No internet service</option>
          </select>
        </div>
        <div>
          <label>Paperless Billing</label>
          <select id="PaperlessBilling">
            <option>Yes</option>
            <option>No</option>
          </select>
        </div>
      </div>
      <button type="submit">Predict Churn Risk</button>
    </form>

    <div id="result" class="result"></div>
  </div>

  <script>
    document.getElementById("churnForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        tenure: Number(document.getElementById("tenure").value),
        MonthlyCharges: Number(document.getElementById("MonthlyCharges").value),
        Contract: document.getElementById("Contract").value,
        InternetService: document.getElementById("InternetService").value,
        PaymentMethod: document.getElementById("PaymentMethod").value,
        TechSupport: document.getElementById("TechSupport").value,
        OnlineSecurity: document.getElementById("OnlineSecurity").value,
        PaperlessBilling: document.getElementById("PaperlessBilling").value,
      };

      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      const box = document.getElementById("result");
      box.className = `result ${data.risk_tier}`;
      box.style.display = "block";
      box.innerHTML = `<strong>${data.risk_tier} Risk</strong> — Churn Prediction: <b>${data.churn_prediction}</b> (${(data.churn_probability * 100).toFixed(1)}% probability)`;
    });
  </script>
</body>
</html>
